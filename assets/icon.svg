<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0d0d0d"/>
  <!-- stripe pattern background -->
  <defs>
    <pattern id="stripe" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="transparent"/>
      <rect width="14" height="28" fill="#f5c400" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#stripe)"/>
  <!-- G letter -->
  <text x="256" y="365"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="380"
        font-weight="900"
        fill="#f5c400"
        letter-spacing="-10">G</text>
  <!-- studio name below -->
  <text x="256" y="440"
        text-anchor="middle"
        font-family="monospace"
        font-size="38"
        fill="#f5c400"
        opacity="0.7"
        letter-spacing="10">GHETTO</text>
</svg>
